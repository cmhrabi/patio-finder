name: Sun rebuild

# Manually fires a sun-batch run against the deployed Vercel endpoint.
#
# Manual dispatch only. Run this (rather than waiting for the nightly incremental
# cron) whenever the sun pipeline or patio set changes, since incremental runs
# leave the 6 middle days untouched. Trigger it from the Actions tab once the new
# code is live on Vercel — otherwise the rebuild hits the still-deployed OLD code.
#
# Pick the mode from the dropdown:
#   missing     — compute only patios that have no rows yet (e.g. after adding a venue)
#   full        — wipe & recompute the whole table for every patio
#   incremental — drop yesterday and append the new 7th day
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'missing = only uncalculated patios; full = wipe & recompute everything; incremental = drop yesterday + add day 7'
        type: choice
        default: missing
        options:
          - missing
          - full
          - incremental

# Don't let two pushes (or a push + manual run) overlap.
concurrency:
  group: sun-full-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rebuild
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUN_BATCH_BASE_URL: ${{ vars.SUN_BATCH_BASE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SUN_BATCH_BASE_URL" ]; then
            echo "Missing CRON_SECRET secret or SUN_BATCH_BASE_URL variable" >&2
            exit 1
          fi
          # Strip any trailing slash so we never build a //api double-slash URL,
          # which Vercel answers with a 308 redirect (the endpoint never runs).
          base="${SUN_BATCH_BASE_URL%/}"
          # --fail-with-body: surface 4xx/5xx bodies. No -L on purpose: a redirect
          # here means a misconfigured base URL, so we want it to fail loudly.
          status=$(curl -sS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 600 \
            -o /tmp/sun-batch-response \
            -w '%{http_code}' \
            "$base/api/cron/sun-batch?mode=${{ inputs.mode }}")
          echo "HTTP $status"
          cat /tmp/sun-batch-response
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Rebuild trigger failed (HTTP $status)" >&2
            exit 1
          fi
